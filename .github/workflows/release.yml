name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or recover
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Set up npm trusted publishing support
        run: npm install --global npm@11.18.0 --registry=https://registry.npmjs.org/

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: bash .github/scripts/release.sh prepare

      - name: Publish and verify npm package
        run: pnpm release:ci

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh publish
